name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every script
        run: python -m py_compile scripts/*.py

      - name: Run every script with --help
        run: |
          for f in scripts/*.py; do
            echo "== $f"
            python "$f" --help > /dev/null
          done
